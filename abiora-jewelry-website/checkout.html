<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout — ABIORA</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head><body><div id="announcement">SECURE CHECKOUT <span>✦</span> FREE SHIPPING OVER ₹999</div><header class="checkout-head"><a class="logo" href="index.html"><span>✦</span>ABIORA<small>ANTI-TARNISH JEWELRY</small></a><span>Secure Checkout 🔒</span></header><main class="checkout-layout"><section class="checkout-form"><div class="steps"><b>1 Shipping</b><span>2 Payment</span><span>3 Order Complete</span></div><h2>Shipping Address</h2><form onsubmit="placeOrder(event)"><div class="two"><input required placeholder="Full Name"><input required placeholder="Phone Number"></div><input required placeholder="Address"><div class="two"><input required placeholder="City"><input required placeholder="State"></div><div class="two"><input required placeholder="PIN Code"><input placeholder="Landmark (optional)"></div><h2>Payment Method</h2><label class="payment"><input type="radio" name="pay" checked> UPI / Google Pay / PhonePe</label><label class="payment"><input type="radio" name="pay"> Cards (Visa, Mastercard, RuPay)</label><label class="payment"><input type="radio" name="pay"> Cash on Delivery</label><button class="btn dark wide">Place Order</button></form></section><aside class="checkout-summary"><h2>Order Summary</h2><div id="checkoutItems"></div><div class="sum"><span>Subtotal</span><b id="subTotal">₹0</b></div><div class="sum"><span>Shipping</span><b>₹50</b></div><div class="sum total"><span>Total</span><b id="grandTotal">₹0</b></div></aside></main><script src="js/app.js"></script>

</body>
</html>
